<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>戦史地図 — 太平洋戦争</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1b1f27;
  --ink-2:#11151b;
  --sea:#1d3a4a;
  --sea-deep:#142a37;
  --paper:#e9dec3;
  --paper-2:#ddceaa;
  --paper-line:#b7a47c;
  --text:#2a261e;
  --text-soft:#5b513f;
  --land:#c8bb98;
  --land-stroke:#9b8a64;
  --accent:#b8402b;
  --accent-2:#d9613f;
  --gold:#c9a14a;
  --home:#a83a32;     /* 日本本国（弁柄・沈めた赤） */
  --axis:#d4a23e;     /* 友好国（枢軸・琥珀） */
  --allied:#6f93b3;   /* 敵対国（連合国・縹） */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Zen Kaku Gothic New",sans-serif;
  color:var(--paper);
  background:
    radial-gradient(1200px 700px at 20% -10%, #233040 0%, transparent 55%),
    radial-gradient(900px 600px at 110% 120%, #20303d 0%, transparent 50%),
    linear-gradient(160deg,#10151c 0%,#0c1016 100%);
  background-attachment:fixed;
  min-height:100vh;
  padding:clamp(16px,4vw,48px);
  position:relative;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.05;z-index:0;
  background-image:linear-gradient(rgba(255,255,255,.6) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.6) 1px,transparent 1px);
  background-size:44px 44px;
}
.wrap{max-width:1180px;margin:0 auto;position:relative;z-index:1}

/* ---------- Header ---------- */
header{display:flex;flex-wrap:wrap;align-items:flex-end;gap:18px;
  border-bottom:1px solid rgba(201,161,74,.35);padding-bottom:18px;margin-bottom:26px}
.title-block{flex:1;min-width:260px}
.kicker{font-size:.72rem;letter-spacing:.42em;color:var(--gold);
  text-transform:uppercase;margin-bottom:8px;font-weight:500}
h1{font-family:"Shippori Mincho B1",serif;font-weight:800;
  font-size:clamp(1.8rem,5vw,3rem);line-height:1.05;color:#f3ead2;letter-spacing:.04em}
h1 .sub{display:block;font-size:.42em;font-weight:600;color:var(--gold);
  letter-spacing:.3em;margin-top:10px}
.tag{align-self:flex-start;font-size:.66rem;letter-spacing:.2em;
  border:1px solid var(--accent);color:var(--accent-2);
  padding:5px 12px;border-radius:2px;font-weight:700;white-space:nowrap}

/* ---------- Layout ---------- */
.grid{display:grid;grid-template-columns:0.9fr 1.1fr;gap:22px}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.panel{
  background:linear-gradient(180deg,#1a2029,#141922);
  border:1px solid rgba(201,161,74,.22);
  border-radius:6px;padding:18px;position:relative;
  box-shadow:0 18px 40px -22px #000;
}
.panel-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.panel-head .no{font-family:"Shippori Mincho B1",serif;color:var(--gold);
  font-size:1.1rem;border:1px solid rgba(201,161,74,.5);
  width:30px;height:30px;display:grid;place-items:center;border-radius:50%}
.panel-head h2{font-family:"Shippori Mincho B1",serif;font-weight:600;
  font-size:1.15rem;color:#efe6cd;letter-spacing:.08em}
.panel-head .en{font-size:.62rem;letter-spacing:.25em;color:var(--text-soft);
  margin-left:auto;text-transform:uppercase}

/* ---------- Theatre (left) ---------- */
.theatre{position:relative;border-radius:4px;overflow:hidden;
  background:radial-gradient(120% 120% at 50% 0%,var(--sea) 0%,var(--sea-deep) 100%)}
.theatre svg{display:block;width:100%;height:auto;cursor:grab;touch-action:none}
.theatre.grabbing svg{cursor:grabbing}
.country{fill:var(--land);stroke:var(--land-stroke);stroke-width:.35;opacity:.9;vector-effect:non-scaling-stroke}
.country.home{fill:var(--home)}
.country.axis{fill:var(--axis)}
.country.allied{fill:var(--allied)}
#graticule line{stroke:rgba(150,200,225,.10);stroke-width:.6;vector-effect:non-scaling-stroke}
/* historical zones */
#zones{pointer-events:none}
#zones .sphere-fill{fill:rgba(207,155,63,.13);stroke:rgba(243,234,210,.5);
  stroke-width:1;stroke-dasharray:2 2.5;vector-effect:non-scaling-stroke}
#zones .defense-line{fill:none;stroke:#c0503a;stroke-width:1.8;
  stroke-dasharray:7 4;stroke-linejoin:round;stroke-linecap:round;
  vector-effect:non-scaling-stroke;filter:drop-shadow(0 0 2px rgba(0,0,0,.5))}
#zones.hide-sphere .sphere-fill{display:none}
#zones.hide-defense .defense-line{display:none}
.zones-legend{margin-top:8px}
.zones-legend label{display:inline-flex;align-items:center;gap:6px;cursor:pointer;
  font-size:.78rem;color:var(--paper)}
.zones-legend input{accent-color:var(--gold);cursor:pointer}
.legend i.ln{width:22px;height:0;border-radius:0;background:none!important}
.legend i.ln.sphere{border-top:2px dotted rgba(243,234,210,.85)}
.legend i.ln.defense{border-top:3px dashed #c0503a}
/* zoom controls */
.map-ctrl{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:6px;z-index:3}
.map-ctrl button{width:32px;height:32px;border:1px solid rgba(201,161,74,.5);
  background:rgba(13,28,37,.72);color:#f3ead2;font-size:17px;font-weight:700;
  border-radius:4px;cursor:pointer;line-height:1;display:flex;align-items:center;
  justify-content:center;backdrop-filter:blur(2px);transition:background .15s,border-color .15s}
.map-ctrl button:hover{background:rgba(184,64,43,.85);border-color:var(--accent-2)}
.map-ctrl button:active{transform:translateY(1px)}
/* timeline */
.timeline{display:flex;align-items:center;gap:12px;margin-top:14px;
  padding:9px 14px;border:1px solid rgba(201,161,74,.28);border-radius:4px;
  background:rgba(13,28,37,.4)}
.timeline button{width:34px;height:34px;flex:none;border:1px solid rgba(201,161,74,.5);
  background:rgba(13,28,37,.72);color:#f3ead2;border-radius:4px;cursor:pointer;
  font-size:13px;line-height:1;transition:background .15s,border-color .15s}
.timeline button:hover{background:rgba(184,64,43,.85);border-color:var(--accent-2)}
.timeline input[type=range]{flex:1;accent-color:var(--gold);cursor:pointer;height:4px}
.tl-label{font-family:"Shippori Mincho B1",serif;color:var(--gold);font-weight:600;
  font-size:.95rem;min-width:6.6em;text-align:right;letter-spacing:.04em;white-space:nowrap}
.marker{cursor:pointer;transition:opacity .45s ease}
.marker.future{opacity:.13}
.marker.future .ping{display:none}
.marker .ping{fill:var(--accent-2);opacity:.5;transform-origin:center;
  transform-box:fill-box;animation:ping 2.4s ease-out infinite}
@keyframes ping{0%{transform:scale(.6);opacity:.6}70%{transform:scale(2.6);opacity:0}100%{opacity:0}}
.marker .dot{fill:var(--accent);stroke:#fff;stroke-width:1.5}
.marker:hover .dot{fill:var(--accent-2)}
.marker.active .dot{fill:#fff;stroke:var(--accent)}
.marker text{fill:#f3ead2;font-size:13px;font-weight:700;
  font-family:"Zen Kaku Gothic New";paint-order:stroke;
  stroke:#0d1c25;stroke-width:3px}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;
  font-size:.72rem;color:var(--text-soft)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:50%;display:inline-block}

/* ---------- Japan map (right) ---------- */
.japan-stage{background:radial-gradient(130% 100% at 50% 0%,#1c232d,#11161d);
  border-radius:4px;padding:8px}
.japan-stage svg{display:block;width:100%;height:auto}
.pref{fill:var(--land);stroke:var(--land-stroke);stroke-width:.6;
  transition:fill .5s ease,filter .5s ease}
.pref.lit{fill:var(--accent);stroke:#f3ead2;stroke-width:1;
  filter:drop-shadow(0 0 6px rgba(217,97,63,.9));animation:lit 1.6s ease infinite}
@keyframes lit{0%,100%{fill:var(--accent)}50%{fill:var(--accent-2)}}
.japan-dim .pref:not(.lit){fill:#6f6a5a;opacity:.55}

/* ---------- Loss pictograph（投入と損耗） ---------- */
.loss-viz{margin-top:12px;padding:12px 14px;display:none;
  border:1px solid rgba(201,161,74,.25);border-radius:4px;background:rgba(13,28,37,.4)}
.loss-viz.show{display:block}
.loss-viz .lv-head{font-family:"Shippori Mincho B1",serif;color:var(--gold);
  font-weight:600;font-size:.92rem;margin-bottom:10px;letter-spacing:.03em}
.loss-viz .lv-figs{display:flex;flex-wrap:wrap;gap:3px 4px;margin-bottom:10px}
.loss-viz .fig{width:11px;height:19px;display:block;color:#dfe7ee}
.loss-viz .fig svg{width:100%;height:100%;display:block;fill:currentColor}
.loss-viz .fig.lost{color:var(--home);opacity:.45}
.loss-viz .lv-text{font-size:.82rem;color:rgba(233,222,195,.9);line-height:1.6}
.loss-viz .lv-text b{color:#f3ead2;font-weight:700}
.loss-viz .lv-text .pct{color:var(--accent-2);font-weight:700;
  font-family:"Shippori Mincho B1",serif;font-size:1.02rem}
.loss-viz .lv-note{font-size:.7rem;color:rgba(233,222,195,.5);margin-top:6px}

/* ---------- Info card ---------- */
.info{margin-top:22px;
  background:
    repeating-linear-gradient(0deg,transparent,transparent 27px,rgba(183,164,124,.18) 28px),
    linear-gradient(180deg,var(--paper),var(--paper-2));
  color:var(--text);border-radius:6px;
  border:1px solid var(--paper-line);
  box-shadow:0 22px 50px -26px #000, inset 0 0 60px rgba(120,90,40,.08);
  overflow:hidden;opacity:0;transform:translateY(14px);
  transition:opacity .5s,transform .5s}
.info.show{opacity:1;transform:none}
.info-inner{padding:clamp(18px,3vw,30px)}
.info .placeholder{padding:40px 24px;text-align:center;color:var(--text-soft);
  font-family:"Shippori Mincho B1",serif;letter-spacing:.1em}
.info h3{font-family:"Shippori Mincho B1",serif;font-weight:800;
  font-size:clamp(1.4rem,4vw,2rem);color:#3a2c18;letter-spacing:.05em;
  display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.info h3 .period{font-size:.5em;font-weight:600;color:var(--accent);
  font-family:"Zen Kaku Gothic New";letter-spacing:.05em}
.route{margin:14px 0 22px;font-family:"Shippori Mincho B1",serif;
  font-size:1.05rem;color:#5a4424;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.route .arrow{color:var(--accent);font-weight:800}
.route b{color:#3a2c18}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:1px;background:var(--paper-line);border:1px solid var(--paper-line);border-radius:4px;overflow:hidden}
.fact{background:linear-gradient(180deg,#efe6ce,#e6d9ba);padding:14px 16px}
.fact .k{font-size:.68rem;letter-spacing:.16em;color:#8a6a3a;
  text-transform:uppercase;margin-bottom:6px;font-weight:700}
.fact .v{font-family:"Shippori Mincho B1",serif;font-weight:700;
  font-size:1.18rem;color:#2e2413;line-height:1.25}
.fact .v small{font-size:.62em;font-weight:500;color:var(--text-soft);display:block;margin-top:3px}
.casualty .v{color:var(--accent)}
.summary{margin-top:20px;font-size:.92rem;line-height:1.85;color:#473a26}
.disclaimer{margin-top:18px;padding-top:14px;border-top:1px dashed var(--paper-line);
  font-size:.74rem;color:#8a7a58;line-height:1.6}
.hint{text-align:center;color:var(--text-soft);font-size:.8rem;margin-top:18px;letter-spacing:.06em}

/* prefecture hover tooltip */
#tip{position:fixed;pointer-events:none;z-index:50;
  background:#15110a;color:#f3ead2;font-size:.78rem;
  padding:4px 9px;border-radius:3px;border:1px solid var(--gold);
  opacity:0;transition:opacity .12s;white-space:nowrap}
footer{margin-top:30px;text-align:center;font-size:.72rem;color:#5a5544;letter-spacing:.1em}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title-block">
      <div class="kicker">Pacific War / 太平洋戦争</div>
      <h1>戦史地図<span class="sub">動員地域でたどる戦いの記録</span></h1>
    </div>
    <div class="tag">PROTOTYPE</div>
  </header>

  <div class="grid">
    <!-- Theatre map -->
    <section class="panel">
      <div class="panel-head">
        <span class="no">壱</span><h2>戦域図</h2><span class="en">Theatre</span>
      </div>
      <div class="theatre">
        <svg id="theatre" preserveAspectRatio="xMidYMid meet">
          <g id="graticule"></g>
          <g id="countries"></g>
          <g id="zones"></g>
          <g id="markers"></g>
        </svg>
        <div class="map-ctrl">
          <button id="zoomIn" type="button" title="拡大" aria-label="拡大">＋</button>
          <button id="zoomOut" type="button" title="縮小" aria-label="縮小">－</button>
          <button id="zoomReset" type="button" title="元に戻す" aria-label="元に戻す">⟳</button>
        </div>
      </div>
      <div class="legend">
        <span><i style="background:var(--accent)"></i>戦闘地点（クリック）</span>
        <span><i style="background:var(--home)"></i>日本</span>
        <span><i style="background:var(--axis)"></i>友好国（枢軸）</span>
        <span><i style="background:var(--allied)"></i>敵対国（連合国）</span>
        <span><i style="background:var(--land)"></i>中立・その他</span>
      </div>
      <div class="legend zones-legend">
        <label><input type="checkbox" id="tgSphere" checked><i class="ln sphere"></i>影響圏（1942 最大進出範囲）</label>
        <label><input type="checkbox" id="tgDefense" checked><i class="ln defense"></i>絶対国防圏（1943）</label>
      </div>
      <div class="timeline">
        <button id="tlPlay" type="button" title="再生" aria-label="再生">▶</button>
        <input id="tlRange" type="range" aria-label="時間軸">
        <span id="tlLabel" class="tl-label"></span>
      </div>
    </section>

    <!-- Japan map -->
    <section class="panel">
      <div class="panel-head">
        <span class="no">弐</span><h2>動員地域</h2><span class="en">Homeland</span>
      </div>
      <div class="japan-stage">
        <svg id="japan" preserveAspectRatio="xMidYMid meet"></svg>
      </div>
      <div class="loss-viz" id="lossViz"></div>
    </section>
  </div>

  <!-- Info card -->
  <div class="info" id="info">
    <div class="placeholder" id="placeholder">― 地図上の地点を選んでください ―</div>
    <div class="info-inner" id="infoInner" style="display:none"></div>
  </div>
  <p class="hint" id="hint">戦域図の赤い印をタップすると、戦いの概要と動員地域が表示されます</p>

  <footer>戦史地図 prototype — 数値・部隊情報は仮データです（要出典確認）</footer>
</div>

<div id="tip"></div>

/* ---------- Render theatre (Pacific-centred world map) ---------- */
const SVGNS="http://www.w3.org/2000/svg";
const tsvg=document.getElementById("theatre");
tsvg.setAttribute("viewBox",WORLD.viewBox);

// equirectangular projection (matches the build step)
function projW(lon,lat){
  let sh=((lon-WORLD.centerLon+540)%360)-180;
  return [ (sh+180)/360*WORLD.W, (90-lat)/180*WORLD.H ];
}

// graticule every 30°
const grat=document.getElementById("graticule");
let gl="";
for(let lon=-180+WORLD.centerLon; lon<=180+WORLD.centerLon; lon+=30){
  const [x]=projW(lon,0);
  gl+=`<line x1="${x.toFixed(1)}" y1="0" x2="${x.toFixed(1)}" y2="${WORLD.H}"/>`;
}
for(let lat=-60; lat<=80; lat+=30){
  const [,y]=projW(0,lat);
  gl+=`<line x1="0" y1="${y.toFixed(1)}" x2="${WORLD.W}" y2="${y.toFixed(1)}"/>`;
}
grat.innerHTML=gl;

// countries — 当時の陣営で色分け（近代の国名を代理に用いた概略）
const HOME=new Set(["Japan"]);
const AXIS=new Set([   // 友好国（枢軸・日本と協力）
  "Thailand","Germany","Italy","Hungary","Romania","Bulgaria","Finland"
]);
const ALLIED=new Set([ // 敵対国（連合国）
  "United States of America","United Kingdom","China","Australia","New Zealand",
  "Netherlands","Canada","India","France"
]);
function sideOf(name){
  if(HOME.has(name)) return "home";
  if(AXIS.has(name)) return "axis";
  if(ALLIED.has(name)) return "allied";
  return "";
}
const cg=document.getElementById("countries");
const cFrag=document.createDocumentFragment();
for(const [name,d] of Object.entries(WORLD.paths)){
  const p=document.createElementNS(SVGNS,"path");
  const side=sideOf(name);
  p.setAttribute("d",d); p.setAttribute("class","country"+(side?" "+side:"")); p.dataset.name=name;
  cFrag.appendChild(p);
}
cg.appendChild(cFrag);

/* ---------- Historical zones (影響圏 / 絶対国防圏) ---------- */
// 経度・緯度の頂点列を投影して経路を作る（概略・仮）
function pathFromLonLat(pts,close){
  let s="";
  pts.forEach((pt,i)=>{ const [x,y]=projW(pt[0],pt[1]); s+=(i?"L":"M")+x.toFixed(1)+","+y.toFixed(1)+" "; });
  return s+(close?"Z":"");
}
// 1942年ごろの最大進出範囲（外周→大陸側の前線で閉じる）
const SPHERE=[
  [173,52.5],[178,50],[166.6,19.3],[173,1.4],[161,-10.5],[150,-10.6],[147,-11],
  [130,-11],[114,-9.5],[104,-7],[98,-3],[94,12],[93,24],
  [98,26],[104,30],[111,34],[114,38],[119,42],[124,46],[128,50],[135,51],
  [142,48],[148,46],[156,50]
];
// 1943年 絶対国防圏（千島〜小笠原〜内南洋〜西部ニューギニア〜スンダ〜ビルマ）※開いた弧
const DEFENSE=[
  [156,50],[142,44],[142,27],[146,15],[151.8,7.4],[141,2],[134,-2],[133,-5],
  [127,-7],[120,-9],[112,-9],[105,-7],[99,0],[94,16],[93,24]

/* ---------- Render Japan map ---------- */
const jsvg=document.getElementById("japan");
jsvg.setAttribute("viewBox",JAPAN.viewBox);
const pathFrag=document.createDocumentFragment();
for(const [name,d] of Object.entries(JAPAN.paths)){
  const p=document.createElementNS("http://www.w3.org/2000/svg","path");
  p.setAttribute("d",d);
  p.setAttribute("class","pref");
  p.dataset.name=name;
  pathFrag.appendChild(p);
}
jsvg.appendChild(pathFrag);

/* ---------- Japan map: 動員地域へ寄せて拡大 ---------- */
const JAPAN_BASE=JAPAN.viewBox.split(/\s+/).map(Number);   // [x,y,w,h]
let japanAnim=null;
function animateJapanViewBox(target){
  if(japanAnim) cancelAnimationFrame(japanAnim);
  const cur=(jsvg.getAttribute("viewBox")||JAPAN.viewBox).split(/\s+/).map(Number);
  const t0=performance.now(), dur=520;
  const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
  (function step(now){
    const p=Math.min(1,(now-t0)/dur), e=ease(p);
    const v=cur.map((c,i)=>c+(target[i]-c)*e);
    jsvg.setAttribute("viewBox",`${v[0].toFixed(1)} ${v[1].toFixed(1)} ${v[2].toFixed(1)} ${v[3].toFixed(1)}`);
    if(p<1) japanAnim=requestAnimationFrame(step);
  })(t0);
}
function fitJapanToPrefectures(names){
  const boxes=names.map(n=>jsvg.querySelector(`[data-name="${n}"]`))
                   .filter(Boolean).map(p=>p.getBBox()).filter(b=>b.width&&b.height);
  if(!boxes.length){ animateJapanViewBox(JAPAN_BASE); return; }
  let x0=Math.min(...boxes.map(b=>b.x)),       y0=Math.min(...boxes.map(b=>b.y));
  let x1=Math.max(...boxes.map(b=>b.x+b.width)),y1=Math.max(...boxes.map(b=>b.y+b.height));
  let bw=x1-x0, bh=y1-y0;
  // 余白（塊の周りに少しゆとり）
  const padX=bw*0.35+JAPAN_BASE[2]*0.03, padY=bh*0.35+JAPAN_BASE[3]*0.03;
  x0-=padX; y0-=padY; bw+=padX*2; bh+=padY*2;
  // 寄せ過ぎ防止（最小でも全体の約25%幅は確保）
  const minW=JAPAN_BASE[2]*0.25, minH=JAPAN_BASE[3]*0.25;
  if(bw<minW){ x0-=(minW-bw)/2; bw=minW; }
  if(bh<minH){ y0-=(minH-bh)/2; bh=minH; }
  // 表示領域の縦横比に合わせて広げる
  const r=jsvg.getBoundingClientRect();
  const A=(r.width&&r.height)?r.width/r.height:JAPAN_BASE[2]/JAPAN_BASE[3];
  if(bw/bh<A){ const nw=bh*A; x0-=(nw-bw)/2; bw=nw; }
  else       { const nh=bw/A; y0-=(nh-bh)/2; bh=nh; }
  animateJapanViewBox([x0,y0,bw,bh]);
}

/* prefecture hover tooltip */

jsvg.addEventListener("mousemove",e=>{

  if(t.classList&&t.classList.contains("pref")){

/* ---------- Render markers on theatre ---------- */
const mg=document.getElementById("markers");
BATTLES.forEach(b=>{
  const [mx,my]=projW(b.lon,b.lat);
  const g=document.createElementNS(SVGNS,"g");
  g.setAttribute("class","marker");
  g.dataset.id=b.id;
  g.innerHTML=`
    <circle class="ping" cx="${mx.toFixed(1)}" cy="${my.toFixed(1)}" r="6"/>
    <circle class="dot" cx="${mx.toFixed(1)}" cy="${my.toFixed(1)}" r="4.5"/>
    <text x="${(mx+10).toFixed(1)}" y="${(my+4).toFixed(1)}">${b.label}</text>`;
  g.addEventListener("click",()=>select(b.id));
  mg.appendChild(g);

/* ---------- Theatre zoom & pan ---------- */
(function(){
  const theatreEl=tsvg.parentElement;
  const base=WORLD.viewBox.split(/\s+/).map(Number);   // [x,y,w,h]
  const aspect=base[2]/base[3];
  const MIN_W=base[2]/14, MAX_W=base[2];               // 最大14倍まで拡大
  const vb={x:base[0],y:base[1],w:base[2],h:base[3]};
  const markerGroups=[...mg.children];
  markerGroups.forEach(g=>{
    const dot=g.querySelector(".dot");
    g.__ax=parseFloat(dot.getAttribute("cx"));
    g.__ay=parseFloat(dot.getAttribute("cy"));
  });
  function apply(){
    tsvg.setAttribute("viewBox",`${vb.x.toFixed(2)} ${vb.y.toFixed(2)} ${vb.w.toFixed(2)} ${vb.h.toFixed(2)}`);
    const k=vb.w/base[2];   // 縮尺（拡大すると1未満）→ 印を定寸に保つ
    markerGroups.forEach(g=>{
      g.setAttribute("transform",`translate(${g.__ax} ${g.__ay}) scale(${k.toFixed(4)}) translate(${-g.__ax} ${-g.__ay})`);
    });
  }
  function clampPan(){
    if(vb.x<0) vb.x=0;
    if(vb.y<0) vb.y=0;
    if(vb.x+vb.w>WORLD.W) vb.x=WORLD.W-vb.w;
    if(vb.y+vb.h>WORLD.H) vb.y=WORLD.H-vb.h;
  }
  function toSvg(clientX,clientY){
    const r=tsvg.getBoundingClientRect();
    return { x:vb.x+(clientX-r.left)/r.width*vb.w, y:vb.y+(clientY-r.top)/r.height*vb.h };
  }
  function zoomAt(clientX,clientY,factor){
    const p=toSvg(clientX,clientY);
    let nw=Math.max(MIN_W,Math.min(MAX_W,vb.w*factor));
    const nh=nw/aspect;
    vb.x=p.x-(p.x-vb.x)*(nw/vb.w);
    vb.y=p.y-(p.y-vb.y)*(nh/vb.h);
    vb.w=nw; vb.h=nh;
    clampPan(); apply();
  }
  function center(){const r=tsvg.getBoundingClientRect();return [r.left+r.width/2,r.top+r.height/2];}
  // 車輪で拡大縮小（カーソル位置を中心に）
  tsvg.addEventListener("wheel",e=>{
    e.preventDefault();
    zoomAt(e.clientX,e.clientY, e.deltaY>0?1.18:0.85);
  },{passive:false});
  // 曳いてスクロール（pointer capture は使わず、印のクリックを妨げない）
  let dragging=false,moved=false,lx=0,ly=0;
  function onMove(e){
    if(!dragging) return;
    const dx=e.clientX-lx, dy=e.clientY-ly;
    if(Math.abs(dx)+Math.abs(dy)>3) moved=true;
    const r=tsvg.getBoundingClientRect();
    vb.x-=dx/r.width*vb.w; vb.y-=dy/r.height*vb.h;
    lx=e.clientX; ly=e.clientY; clampPan(); apply();
  }
  function endDrag(){
    if(!dragging) return;
    dragging=false; theatreEl.classList.remove("grabbing");
    window.removeEventListener("pointermove",onMove);
    window.removeEventListener("pointerup",endDrag);
  }
  tsvg.addEventListener("pointerdown",e=>{
    dragging=true; moved=false; lx=e.clientX; ly=e.clientY;
    theatreEl.classList.add("grabbing");
    window.addEventListener("pointermove",onMove);
    window.addEventListener("pointerup",endDrag);
  });
  // 曳行後の誤クリックで戦闘が選ばれぬよう抑止
  mg.addEventListener("click",e=>{ if(moved){ e.stopPropagation(); e.preventDefault(); } },true);
  // ボタン操作
  document.getElementById("zoomIn").onclick=()=>{const[cx,cy]=center();zoomAt(cx,cy,0.7);};
  document.getElementById("zoomOut").onclick=()=>{const[cx,cy]=center();zoomAt(cx,cy,1/0.7);};
  document.getElementById("zoomReset").onclick=()=>{vb.x=base[0];vb.y=base[1];vb.w=base[2];vb.h=base[3];apply();};
  apply();
})();

/* ---------- Timeline（時間軸スライダー） ---------- */
(function(){
  const range=document.getElementById("tlRange");
  const label=document.getElementById("tlLabel");
  const playBtn=document.getElementById("tlPlay");
  // 各戦いの開戦日を period 先頭から解析
  function startDate(b){
    const m=b.period.match(/(\d{4})\.(\d{1,2})\.(\d{1,2})/);
    return m ? new Date(+m[1],+m[2]-1,+m[3]).getTime() : 0;
  }
  const items=[...mg.children].map(g=>({
    g, t:startDate(BATTLES.find(x=>x.id===g.dataset.id))
  })).filter(it=>it.t);
  const times=items.map(it=>it.t);
  const minT=Math.min(...times), maxT=Math.max(...times);
  const DAY=86400000;
  range.min=minT; range.max=maxT; range.step=DAY; range.value=maxT;
  const fmt=t=>{const d=new Date(+t);return d.getFullYear()+"年"+(d.getMonth()+1)+"月";};
  function refresh(){
    const cur=+range.value;
    items.forEach(it=>it.g.classList.toggle("future",it.t>cur));
    label.textContent=fmt(cur);
  }
  range.addEventListener("input",()=>{ stop(); refresh(); });
  // 再生
  let playing=false, raf=null, t0=0, fromVal=0;
  const DURATION=11000; // 開戦→終戦を約11秒で
  function step(now){
    const p=Math.min(1,(now-t0)/DURATION);
    range.value=fromVal+(maxT-fromVal)*p;
    refresh();
    if(p<1){ raf=requestAnimationFrame(step); } else { stop(); }
  }
  function play(){
    if(playing) return;
    // 終端にある時は頭から
    if(+range.value>=maxT) range.value=minT;
    playing=true; playBtn.textContent="⏸"; playBtn.title="一時停止";
    fromVal=+range.value; t0=performance.now();
    raf=requestAnimationFrame(step);
  }
  function stop(){
    if(!playing) return;
    playing=false; cancelAnimationFrame(raf);
    playBtn.textContent="▶"; playBtn.title="再生";
  }
  playBtn.addEventListener("click",()=>{ playing?stop():play(); });
  refresh();   // 初期は全期間（全戦表示）
})();

/* ---------- Selection logic ---------- */
const info=document.getElementById("info");
const placeholder=document.getElementById("placeholder");
const infoInner=document.getElementById("infoInner");
const hint=document.getElementById("hint");

function clearLit(){document.querySelectorAll(".pref.lit").forEach(p=>p.classList.remove("lit"));}

/* 投入兵力と損耗の絵組み（人型アイコン＋文字） */
const lossViz=document.getElementById("lossViz");
const FIG_SVG='<svg viewBox="0 0 11 19" aria-hidden="true"><circle cx="5.5" cy="3.2" r="3"/><path d="M5.5 6.4c2.6 0 3.6 1.8 3.6 4.6v5.2c0 1.2-.6 2-1.6 2H3.5c-1 0-1.6-.8-1.6-2v-5.2c0-2.8 1-4.6 3.6-4.6Z"/></svg>';
function niceUnit(force){
  const units=[50,100,200,250,500,1000,2000,2500,5000,10000];
  for(const u of units){ if(force/u<=40) return u; }
  return 20000;
}
function fmtMen(n){ return n>=100000 ? +(n/10000).toFixed(1)+"万" : n.toLocaleString(); }
function renderLossViz(b){
  const fd=FORCE[b.id];
  if(!fd){ lossViz.className="loss-viz"; lossViz.innerHTML=""; return; }
  const {f,l}=fd;
  const unit=niceUnit(f);
  const total=Math.max(1,Math.round(f/unit));
  const lost=Math.min(total,Math.round(l/unit));
  const pct=Math.round(l/f*100);
  let figs="";
  for(let i=0;i<total;i++){ figs+=`<span class="fig${i<lost?" lost":""}">${FIG_SVG}</span>`; }
  const naval=b.prefectures.length===0;
  lossViz.innerHTML=
    `<div class="lv-head">投入兵力と損耗 — ${b.originLabel}</div>`+
    `<div class="lv-figs">${figs}</div>`+
    `<div class="lv-text">投入 約<b>${fmtMen(f)}</b>名 ／ うち戦没 約<b>${fmtMen(l)}</b>名 　<span class="pct">${pct}%</span> が失われた</div>`+
    `<div class="lv-note">人型1つ ≈ ${unit.toLocaleString()}名（概数・仮データ）${naval?"／ 海軍の戦い（郷土動員なし）":""}</div>`;
  lossViz.className="loss-viz show";
}

function select(id){
  const b=BATTLES.find(x=>x.id===id);
  if(!b) return;
  document.querySelectorAll(".marker").forEach(m=>m.classList.toggle("active",m.dataset.id===id));

  clearLit();
  document.querySelector(".grid")?.classList.add("japan-dim");
  b.prefectures.forEach(name=>{
    const p=jsvg.querySelector(`[data-name="${name}"]`);
    if(p) p.classList.add("lit");
  });
  // 動員地域へ寄せて拡大（海軍の戦いは全体表示へ戻す）
  if(b.prefectures.length) fitJapanToPrefectures(b.prefectures);
  else animateJapanViewBox(JAPAN_BASE);
  renderLossViz(b);   // 投入兵力と損耗の絵組み

  placeholder.style.display="none";
  infoInner.style.display="block";
  infoInner.innerHTML=`
    <h3>${b.name}<span class="period">${b.period}</span></h3>
    <div class="route"><b>${b.label}</b><span class="arrow">⟶ 動員 ⟶</span><b>${b.originLabel}</b></div>
    <div class="facts">
      <div class="fact"><div class="k">主力部隊</div><div class="v">${b.unit}<small>${b.unitNote||""}</small></div></div>
      <div class="fact casualty"><div class="k">日本軍 戦没</div><div class="v">${b.jpLoss}<small>${b.jpLossNote||""}</small></div></div>
      <div class="fact casualty"><div class="k">米軍 損害</div><div class="v">${b.usLoss}<small>${b.usLossNote||""}</small></div></div>
      <div class="fact"><div class="k">動員地域</div><div class="v">${b.originLabel}</div></div>
    </div>
    <p class="summary">${b.summary}</p>
    <p class="disclaimer">※ 本データはプロトタイプ用の仮置きです。戦没者数・部隊編成・動員地域は資料により差があり、公開前に一次資料での裏取りが必要です。</p>`;
  info.classList.add("show");
  hint.textContent="別の地点を選ぶと、表示が切り替わります";
  if(window.innerWidth<860) info.scrollIntoView({behavior:"smooth",block:"start"});
}
</script>
